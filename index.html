  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0b0e; color: #ffffff; display: flex; justify-content: center; min-height: 100vh; }
    
    .card { width: 100%; max-width: 420px; background: #121215; border: 1px solid #27272a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }

    .badge-online { position: absolute; bottom: 6px; right: 6px; width: 14px; height: 14px; background: #22c55e; border: 2px solid #121215; border-radius: 50%; }

    .profile-title { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 4px; justify-content: center; }

    /* Botão de Ação */

    .btn-target:active { transform: scale(0.98); }

    .footer-links { display: flex; gap: 12px; }
    .footer-links a { color: #71717a; text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }

  <script>
    // COLE O LINK DO SEU BOT / CANAL ABAIXO
    const urlTelegram = "COLE_O_LINK_DO_SEU_BOT_AQUI";

    function redirecionarTelegram() {
      if (typeof ttq !== 'undefined') {
        ttq.track('ClickButton');
        ttq.track('CompleteRegistration');
      }

      setTimeout(function() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        if (/TikTok/i.test(ua) && /Android/i.test(ua)) {
          const cleanUrl = urlTelegram.replace(/^https?:\/\//, '');
          window.location.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end`;
        } else {
          window.location.href = urlTelegram;
        }
      }, 150);
    }
  </script>
